<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Crocs Store</title>
    <link rel="icon" type="image/jpeg" href="images/1.logo.jpeg">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="loginScreen" class="login-screen">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <img src="images/1.logo.jpeg" alt="Crocs Store Logo" class="login-logo">
                    <h1>Painel Administrativo</h1>
                    <p>Crocs Store - Moda com Estilo</p>
                </div>
                
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">Usuário:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn-login">Entrar</button>
                </form>
                
                <div id="loginError" class="error-message" style="display: none;">
                    Usuário ou senha inválidos
                </div>
            </div>
        </div>
    </div>

    <!-- Painel Administrativo -->
    <div id="adminPanel" class="admin-panel" style="display: none;">
        <header class="admin-header">
            <div class="admin-nav">
                <div class="admin-logo">
                    <img src="images/1.logo.jpeg" alt="Crocs Store Logo">
                    <span>Admin Panel</span>
                </div>
                <button id="logoutBtn" class="btn-logout">Sair</button>
            </div>
        </header>

        <main class="admin-main">
            <div class="admin-container">
                <h1>Gerenciamento de Produtos</h1>
                
                <!-- Formulário para Adicionar Produto -->
                <section class="add-product-section">
                    <h2>Adicionar Novo Produto</h2>
                    <form id="addProductForm" class="product-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="productName">Nome do Produto:</label>
                                <input type="text" id="productName" name="productName" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="productPrice">Preço:</label>
                                <input type="number" id="productPrice" name="productPrice" step="0.01" required>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="productCategory">Categoria:</label>
                                <select id="productCategory" name="productCategory" required>
                                    <option value="">Selecione...</option>
                                    <option value="camisa">Camisa</option>
                                    <option value="bermuda">Bermuda</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="productImage">Nome da Imagem:</label>
                                <input type="text" id="productImage" name="productImage" 
                                       placeholder="ex: camisa_preta.jpeg" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn-add">Adicionar Produto</button>
                    </form>
                </section>

                <!-- Lista de Produtos -->
                <section class="products-list-section">
                    <h2>Produtos Cadastrados</h2>
                    <div id="productsList" class="products-grid">
                        <!-- Produtos serão carregados dinamicamente -->
                    </div>
                </section>
            </div>
        </main>

        <!-- Modal de Edição -->
        <div id="editModal" class="modal" style="display: none;">
            <div class="modal-content">
                <span class="close" onclick="closeEditModal()">&times;</span>
                <h2>Editar Produto</h2>
                <form id="editProductForm" class="product-form">
                    <input type="hidden" id="editProductId">
                    
                    <div class="form-group">
                        <label for="editProductName">Nome do Produto:</label>
                        <input type="text" id="editProductName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editProductPrice">Preço:</label>
                        <input type="number" id="editProductPrice" step="0.01" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="editProductCategory">Categoria:</label>
                        <select id="editProductCategory" required>
                            <option value="camisa">Camisa</option>
                            <option value="bermuda">Bermuda</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="editProductImage">Nome da Imagem:</label>
                        <input type="text" id="editProductImage" required>
                    </div>
                    
                    <button type="submit" class="btn-save">Salvar Alterações</button>
                </form>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
