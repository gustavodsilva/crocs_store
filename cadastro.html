<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Tom Store</title>
    <link rel="icon" type="image/jpeg" href="images/1.logo.jpeg">
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <!-- Tela de Cadastro -->
    <div class="cadastro-container">
        <div class="cadastro-card">
            <div class="cadastro-header">
                <img src="images/1.logo.jpeg" alt="Tom Store Logo" class="cadastro-logo">
                <h1>Cadastrar na Tom Store</h1>
                <p>Crie sua conta para comprar e receber ofertas exclusivas</p>
            </div>
            
            <form id="cadastroForm" class="cadastro-form">
                <!-- Dados Pessoais -->
                <div class="form-section">
                    <h3>👤 Dados Pessoais</h3>
                    
                    <div class="form-group">
                        <label for="nome">Nome Completo:*</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefone">Telefone:*</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
                        <small class="form-help">Será usado como seu login</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="dataNascimento">Data de Nascimento:</label>
                        <input type="date" id="dataNascimento" name="dataNascimento">
                    </div>
                </div>
                
                <!-- Endereço -->
                <div class="form-section">
                    <h3>📍 Endereço</h3>
                    
                    <div class="form-group">
                        <label for="cep">CEP:*</label>
                        <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                        <small class="form-help">Digite o CEP para preencher automaticamente</small>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="rua">Rua:*</label>
                            <input type="text" id="rua" name="rua" required readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="numero">Número:*</label>
                            <input type="text" id="numero" name="numero" required>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="complemento">Complemento:</label>
                        <input type="text" id="complemento" name="complemento" placeholder="Apto, casa, etc.">
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="bairro">Bairro:*</label>
                            <input type="text" id="bairro" name="bairro" required readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="cidade">Cidade:*</label>
                            <input type="text" id="cidade" name="cidade" required readonly>
                        </div>
                        
                        <div class="form-group">
                            <label for="estado">Estado:*</label>
                            <input type="text" id="estado" name="estado" maxlength="2" required readonly>
                        </div>
                    </div>
                </div>
                
                <!-- Senha -->
                <div class="form-section">
                    <h3>🔐 Senha</h3>
                    
                    <div class="form-group">
                        <label for="senha">Senha:*</label>
                        <input type="password" id="senha" name="senha" required minlength="6">
                        <small class="form-help">Mínimo de 6 caracteres</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar Senha:*</label>
                        <input type="password" id="confirmarSenha" name="confirmarSenha" required minlength="6">
                    </div>
                </div>
                
                <!-- Botões -->
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="window.location.href='login.html'">
                        Já tenho conta
                    </button>
                    <button type="submit" class="btn-primary" id="cadastroBtn">
                        <span class="btn-text">Cadastrar</span>
                        <span class="btn-loading" style="display: none;">Cadastrando...</span>
                    </button>
                </div>
            </form>
            
            <!-- Mensagens de Erro/Sucesso -->
            <div id="cadastroError" class="error-message" style="display: none;">
                <span class="error-icon">⚠️</span>
                <span class="error-text"></span>
            </div>
            
            <div id="cadastroSuccess" class="success-message" style="display: none;">
                <span class="success-icon">✅</span>
                <span class="success-text"></span>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p>Processando...</p>
    </div>

    <script src="cadastro.js"></script>
</body>
</html>
